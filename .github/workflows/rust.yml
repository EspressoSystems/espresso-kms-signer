name: Rust

on:
  push:
    branches: ["base"]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show  # picks up rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --check

  # Asserts the streamer version the shape check declares
  # (SUPPORTED_STREAMER_VERSION in src/batch_shape.rs) equals the pin the fixtures
  # are generated from (tests/fixtures/gen/go.mod). Keeps the two provably in sync.
  streamer-version:
    name: Streamer version pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pin=$(grep -oE 'espresso-streamers v[0-9]+\.[0-9]+\.[0-9]+' tests/fixtures/gen/go.mod | awk '{print $2}')
          const=$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' src/batch_shape.rs | head -1)
          echo "go.mod pin: '$pin'  |  SUPPORTED_STREAMER_VERSION: '$const'"
          if [ -z "$pin" ] || [ "$pin" != "$const" ]; then
            echo "::error::SUPPORTED_STREAMER_VERSION ($const) must equal the go.mod streamer pin ($pin)"
            exit 1
          fi

  # Regenerates the wire fixtures from the pinned Go dependencies and fails on
  # any diff. This is the drift detector between this sidecar and the
  # espresso-streamers batch encoding: if the pinned format no longer matches
  # the committed fixtures, the change must be deliberate, not accidental.
  fixtures:
    name: Fixture drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tests/fixtures/gen/go.mod
      - run: go run . -out ../
        working-directory: tests/fixtures/gen
      # add -N makes newly generated (untracked) fixtures visible to diff, so a
      # fixture that exists only after regeneration also counts as drift.
      - run: git add -N tests/fixtures && git diff --exit-code tests/fixtures
